name: Keep backend awake

# Supabase pauses free projects after about a week with no activity. This pings the function and, through
# ?db=1, the database. It runs twice a week because a strictly weekly run leaves no margin: GitHub can start
# scheduled jobs late or skip one. GitHub also switches schedules off after 60 days without a commit; if that
# happens, re-enable the workflow on the Actions tab.
on:
  schedule:
    - cron: "17 3 * * 1,4"   # Mondays and Thursdays, 03:17 UTC
  workflow_dispatch:

permissions: {}

env:
  GAAO_BACKEND: https://oqznbxiibpiocvwoqexj.supabase.co/functions/v1/gaao

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          body=$(curl -fsS --retry 4 --retry-delay 30 --retry-all-errors --max-time 30 "$GAAO_BACKEND/health?db=1")
          echo "$body"
          echo "$body" | grep -q '"ok":true'
          if ! echo "$body" | grep -q '"db":true'; then
            echo "::warning::/health answered but did not confirm a database query. Deploy the latest function."
          fi
